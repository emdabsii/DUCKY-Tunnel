<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD600" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#FFD600" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="yel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FFD600" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow1 { stroke-dasharray: 18 22; animation: dash1 2.2s linear infinite; }
      .flow2 { stroke-dasharray: 12 28; animation: dash2 3.1s linear infinite; }
      .pulse { animation: breathe 2.8s ease-in-out infinite; transform-origin: 600px 135px; }
      @keyframes dash1 { to { stroke-dashoffset: -120; } }
      @keyframes dash2 { to { stroke-dashoffset: 120; } }
      @keyframes breathe { 0%,100% { opacity: 0.72; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="21" fill="none" stroke="#22222c" stroke-width="1.5"/>
  <ellipse cx="600" cy="140" rx="460" ry="115" fill="url(#glow)"/>

  <!-- Animated Energy Flow Curves (Left Entry -> Core -> Right Exit) -->
  <path d="M 40 90 C 220 90, 290 140, 440 140" fill="none" stroke="#1e1e28" stroke-width="2"/>
  <path d="M 40 190 C 220 190, 290 140, 440 140" fill="none" stroke="#1e1e28" stroke-width="2"/>
  <path d="M 760 140 C 910 140, 980 90, 1160 90" fill="none" stroke="#1e1e28" stroke-width="2"/>
  <path d="M 760 140 C 910 140, 980 190, 1160 190" fill="none" stroke="#1e1e28" stroke-width="2"/>

  <path class="flow1" d="M 40 90 C 220 90, 290 140, 440 140" fill="none" stroke="#FFD600" stroke-width="2.6" filter="url(#neon)"/>
  <path class="flow2" d="M 40 190 C 220 190, 290 140, 440 140" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path class="flow1" d="M 760 140 C 910 140, 980 90, 1160 90" fill="none" stroke="#FFD600" stroke-width="2.6" filter="url(#neon)"/>
  <path class="flow2" d="M 760 140 C 910 140, 980 190, 1160 190" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Moving Packet Orbs -->
  <circle r="4.5" fill="#FFD600" filter="url(#neon)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 40 90 C 220 90, 290 140, 440 140"/>
  </circle>
  <circle r="3.5" fill="#FFFFFF">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 40 190 C 220 190, 290 140, 440 140"/>
  </circle>
  <circle r="4.5" fill="#FFD600" filter="url(#neon)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 760 140 C 910 140, 980 90, 1160 90"/>
  </circle>
  <circle r="3.5" fill="#FFFFFF">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 760 140 C 910 140, 980 190, 1160 190"/>
  </circle>

  <!-- Node Pills -->
  <rect x="26" y="70" width="132" height="38" rx="10" fill="#121218" stroke="#FFD600" stroke-opacity="0.5"/>
  <text x="92" y="94" fill="#FFFFFF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" text-anchor="middle">IRAN ENTRY</text>
  <rect x="26" y="170" width="132" height="38" rx="10" fill="#121218" stroke="#2c2c38"/>
  <text x="92" y="194" fill="#A0A0B2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" text-anchor="middle">BBR + RPS</text>

  <rect x="1042" y="70" width="132" height="38" rx="10" fill="#121218" stroke="#FFD600" stroke-opacity="0.5"/>
  <text x="1108" y="94" fill="#FFD600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" text-anchor="middle">KHAREJ #1</text>
  <rect x="1042" y="170" width="132" height="38" rx="10" fill="#121218" stroke="#2c2c38"/>
  <text x="1108" y="194" fill="#FFFFFF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" text-anchor="middle">FAILOVER #2</text>

  <!-- Center Brand Title -->
  <g class="pulse">
    <text x="600" y="128" fill="#FFFFFF" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="64" font-weight="800" letter-spacing="10" text-anchor="middle">DUCK<tspan fill="#FFD600">Y</tspan></text>
  </g>
  <text x="600" y="164" fill="#FFD600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="4" text-anchor="middle">NEXT-GEN MODULAR TUNNEL SUITE • v1.0</text>
  <text x="600" y="196" fill="#9A9AA8" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13.5" text-anchor="middle">Backhaul TCP+UDP  •  Rathole Hybrid  •  GRE / 6to4 / FOU  •  Realm Rust  •  Sentinel Failover  •  Telegram Bot</text>
  <rect x="470" y="218" width="260" height="28" rx="14" fill="#121218" stroke="#FFD600" stroke-opacity="0.45"/>
  <text x="600" y="236" fill="#FFFFFF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" text-anchor="middle">t.me/Em4dloverS  |  @KaMr4ng</text>
</svg>
